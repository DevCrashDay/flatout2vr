; FO2HeadTrack - SteamVR headset drives the in-game camera (6DoF) and the game is shown
; as a 3D screen inside SteamVR. Needs FlatOut2.exe v1.2 (5,369,344 bytes).
; Start SteamVR first (e.g. from Virtual Desktop), then the game. Log: FO2HeadTrack.log

[MAIN]
Enabled=1            ; 0 = mod does nothing
OnlyInRace=1         ; 1 = only move the camera while driving (menus stay normal)
HideCursor=1         ; hide the mouse cursor while driving
DpiAware=1           ; 1 = render at the real desktop resolution with Windows display scaling
PinGameToOneCore=0   ; 1 = game threads on one CPU core, the mod's threads on the others
GameCore=-1          ; core for PinGameToOneCore (-1 = lowest available)

[SEAT]
Cockpit=1            ; 1 = camera fixed to the driver's seat
; Your eye position relative to the middle of the car, in meters (works in every camera view).
; Adjust live while driving: Ctrl+Left/Right, Ctrl+Up/Down (forward/back), Ctrl+PageUp/PageDown (up/down).
; Then press F9 to save. Tip: use the game's bumper camera so the car body is not drawn around you.
Right=-0.360
Up=0.550
Forward=-0.250
Step=0.02

[TRACKING]
PositionScale=1.0    ; 0 = rotation only, 1 = real head movement in meters
UsePosition=1
UseRoll=1            ; 0 = ignore head tilt to the side
PredictionSeconds=0.035
TestMotion=0         ; 1 = fake head movement without a headset (for testing)

[STEREO]
Mode=1               ; 1 = both eyes from every frame (depth based, full frame rate per eye, half width per eye), 0 = eyes take turns (full width, half frame rate per eye)
DepthSteps=48        ; quality of the depth-based eye views (more = cleaner edges, more GPU)
AlternateEyes=1      ; 1 = real 3D (Mode=0: left and right eye rendered on alternating frames)
IPD=0                ; eye distance in meters, 0 = take it from the headset
DepthScale=1.0       ; >1 = stronger 3D, <1 = weaker
NearestDepth=0.5     ; meters: anything nearer (car body, pillars) gets this depth, so nothing pops right into your eyes
GameFOV=90           ; horizontal field of view in degrees while driving, 0 = game default
NoSpeedZoom=1        ; 1 = keep the field of view fixed (the game widens it with speed, which feels wrong in VR)

[OVERLAY]
; The game picture shown in SteamVR.
; Adjust live: Ctrl+Shift+Up/Down = size, Ctrl+Shift+Left/Right = distance, Ctrl+Shift+PageUp/PageDown = height.
Enabled=1
WorldLock=1          ; 1 = each frame stays where your head was when it was drawn (feels like looking around)
VRFrames=1           ; 1 = the game runs as a real SteamVR app (smoothest), 0 = old overlay mode
Transport=0          ; 0 = with DXVK, hand frames to SteamVR on the GPU, 1 = desktop capture
ReprojectDistance=3.0 ; meters: depth at which the picture is pinned in the world
AutoWidth=1          ; 1 = screen size follows the game's field of view so the world has real scale
WidthScale=1.000     ; fine-tune for AutoWidth: if the world swims when you turn your head, change this
SideBySide3D=0       ; only for AlternateEyes=0: 1 = ReShade SuperDepth3D side-by-side image
Distance=2.000       ; meters: distance of the flat screen in menus and loading screens
Width=2.400          ; meters: width of that screen (also used in races when AutoWidth=0)
Up=0.000
BlackBackground=1    ; black backdrop instead of the SteamVR world around the screen

[KEYS]
; Windows virtual key codes. 118 = F7, 119 = F8, 120 = F9, 121 = F10
Toggle=118           ; head tracking on/off
Recenter=119         ; look straight ahead and press to recenter
Save=120             ; save seat and screen adjustments to this file
ToggleOverlay=121    ; SteamVR screen on/off

[HUD]
; Compact HUD: speed + gear, and position / lap / lap time (screen panels when the gauges are off).
Enabled=1
Scale=1.0
SpeedX=0.60          ; panel centers as a fraction of the screen (0 = left/top, 1 = right/bottom)
SpeedY=0.72
InfoX=0.50
InfoY=0.20

[GAUGES]
; Round rev counter and speedometer fixed in the car, drawn in 3D for both eyes (needs Cockpit=1),
; with the position / lap / lap time bar above them. Faces and needles: <game>\gauge_mod.
; Positions are in meters from your eyes when you sit straight (after F8 recenter).
Enabled=1
Distance=0.65        ; ahead of your eyes
Down=0.21            ; below your eyes
Right=0.00           ; sideways (+ = right) for the middle of the gauges
Spacing=0.16         ; distance between gauge centers
Size=0.065           ; gauge radius
MaxRpm=9000
Redline=7500
MaxSpeed=320         ; km/h

[HUDLIFT]
; The game's own map and speedometer/nitro gauge are taken off the screen and shown on the dashboard.
; Needs [GAUGES] Enabled=1.
Enabled=1
ReplaceGauges=1      ; 1 = they replace the mod's rev counter and speedometer, 0 = shown beside them
; Screen areas as fractions of the screen: left, top, right, bottom (0 = left/top edge, 1 = right/bottom).
; What the game draws over the race inside an area moves to the dashboard.
MapArea=0.040,0.450,0.260,0.810
BoostArea=0.765,0.585,0.985,0.980
Scale=1.0            ; size of the two instruments (1 = as big as a gauge)
SaveScreenshot=0     ; 1 = save one race frame with the game's HUD as FO2HeadTrack_hud.png

[DEBUG]
; Only for tracking down problems. The log (FO2HeadTrack.log) records crashes and freezes of the game.
CameraHook=1         ; 0 = never move the game camera (VR shows the normal game view)
FieldOfView=1        ; 0 = never change the game's field of view (GameFOV and NoSpeedZoom are ignored)
CrashLog=1           ; 0 = no crash/freeze log
